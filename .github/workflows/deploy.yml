name: SPARK DApp CI/CD

# ============================================================
#  SPARK 星火通证 - 推送即部署 (Push-to-Deploy)
#  ----------------------------------------------------------
#  触发条件:
#    1. push 到 main 分支 (含 AI 合并 PR)
#    2. 手动 workflow_dispatch (可传 version 参数)
#  流程: 检出 → 校验 → (可选构建) → 部署到 GitHub Pages
#  AI 合并 PR 到 main 后自动触发本流程，实现"合并即上线"
# ============================================================

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 1.2.0)，留空则自动读取 VERSION 文件"
        required: false
        default: ""

# 允许工作流写入仓库 + Pages 发布权限
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间仅一个部署运行，避免并发冲突
concurrency:
  group: spark-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 检出代码
        uses: actions/checkout@v4

      - name: 📦 校验 index.html 完整性
        run: |
          echo "==> 校验关键标记..."
          grep -q "0xD580C7C9Cde5ce776fEed844310330A2a40078d9" index.html || (echo "❌ 合约地址缺失" && exit 1)
          grep -q "SPARKApp" index.html || (echo "❌ SPARKApp 类缺失" && exit 1)
          grep -q "GitHubUpgradeManager" index.html || (echo "❌ 升级管理器缺失" && exit 1)
          echo "✅ 核心标记校验通过"

      - name: 🧪 基础语法/链接检查 (可选)
        run: |
          python3 - <<'PY'
          import re, html as htmllib
          src = open('index.html', encoding='utf-8').read()
          # 检测 script 内大括号平衡
          m = re.search(r'<script>(.*?)</script>', src, re.S)
          js = m.group(1)
          assert js.count('{') == js.count('}'), "JS 大括号不平衡"
          print("✅ JS 大括号平衡")
          print(f"   文件大小: {len(src.encode())} bytes")
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    # 仅在合并到 main 后部署（push 事件自动触发）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🔍 检出代码
        uses: actions/checkout@v4

      - name: ⚙️ 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 上传构建产物 (单页 index.html)
        uses: actions/upload-pages-artifact@v3
        with:
          # SPARK 为单文件 DApp，直接上传根目录
          path: "."

      - name: 🚀 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 🏷️ 更新 VERSION 并提交标签 (AI 可追踪)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [ -f VERSION ]; then
            VERSION="$(cat VERSION)"
          fi
          if [ -n "$VERSION" ]; then
            git config user.name  "spark-ai-bot"
            git config user.email "spark-ai@users.noreply.github.com"
            git tag -a "v${VERSION}" -m "🤖 AI auto-deploy v${VERSION}"
            git push origin "v${VERSION}" || true
            echo "✅ 已打标签 v${VERSION}"
          fi
          echo "🌐 部署完成: https://sparky12315000.github.io/"
