name: Deploy SPARK DApp + Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write       # 用于发布 Releases / Pages
  pages: write
  id-token: write

jobs:
  # ===== 1) 部署网站到 GitHub Pages =====
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Build (拷贝前端)
        run: |
          mkdir -p _site
          # 前端即静态文件，直接拷贝（index.html + js/）
          cp -r index.html js android scripts *.md _site/ 2>/dev/null || true
          [ -f _site/index.html ] || cp index.html _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ===== 2) 构建签名 APK =====
  build-apk:
    runs-on: ubuntu-latest
    needs: deploy-pages
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install Capacitor
        run: npm install -g @capacitor/cli @capacitor/core @capacitor/android
      - name: Init & sync android
        run: |
          [ -f package.json ] || npm init -y >/dev/null
          npx cap init "SPARK 星火通证" "com.spark.token" --web-dir="." || true
          npx cap add android || true
          npx cap sync android || true
      - name: Generate signed keystore
        run: |
          cd android
          keytool -genkeypair -v -keystore spark-release-key.keystore -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'spark12345' }} -keypass ${{ secrets.ANDROID_KEY_PASSWORD || 'spark12345' }} -alias sparkrelease -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SPARK, OU=Token, O=SPARK, C=CN"
      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PsparkKeystorePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'spark12345' }} \
            -PsparkKeyPassword=${{ secrets.ANDROID_KEY_PASSWORD || 'spark12345' }} \
            -Dandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'spark12345' }} \
            -Dandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD || 'spark12345' }} \
            -Dandroid.injected.signing.key.alias=sparkrelease \
            -Dandroid.injected.signing.key.store=spark-release-key.keystore
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: SPARK Android v${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            🤖 SPARK 星火通证 Android APP (v${{ github.run_number }})
            - 钱包连接 / 链上空投 / P2P 聊天 / Web3 AI / 商城 / 行情
            - 安装：下载 APK → 允许「未知来源」→ 安装
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
