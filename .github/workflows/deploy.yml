name: Deploy SPARK DApp + Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write       # 发布 Pages / Releases 所需的写权限

jobs:
  # ===== 1) 部署网站到 GitHub Pages（不依赖仓库级权限开关） =====
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r js _site/ 2>/dev/null || true
          cp -r android-stub _site/ 2>/dev/null || true
          cp -r scripts _site/ 2>/dev/null || true
          cp README.md CAPACITOR_NOTES.md package.json _site/ 2>/dev/null || true
          [ -f _site/index.html ] && echo "✅ site built" || (echo "❌ missing index.html" && exit 1)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages   # 发布到 gh-pages 分支，Pages 设为该分支即可
          user_name: 'SPARK Deploy'
          user_email: 'deploy@spark.token'
          commit_message: 'chore(pages): deploy SPARK DApp [skip ci]'

  # ===== 2) 构建签名 APK（与 pages 并行，互不阻塞） =====
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install Capacitor
        run: npm install -g @capacitor/cli @capacitor/core @capacitor/android

      - name: Init & sync android
        run: |
          [ -f package.json ] || npm init -y >/dev/null
          npx cap init "SPARK 星火通证" "com.spark.token" --web-dir="." || true
          npx cap add android || true
          npx cap sync android || true

      - name: Generate signed keystore
        run: |
          cd android
          keytool -genkeypair -v \
            -keystore spark-release-key.keystore \
            -storepass "${ANDROID_KEYSTORE_PASSWORD:-spark12345}" \
            -keypass "${ANDROID_KEY_PASSWORD:-spark12345}" \
            -alias sparkrelease -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SPARK, OU=Token, O=SPARK, C=CN"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PsparkKeystorePassword="${ANDROID_KEYSTORE_PASSWORD:-spark12345}" \
            -PsparkKeyPassword="${ANDROID_KEY_PASSWORD:-spark12345}" \
            -Dandroid.injected.signing.store.password="${ANDROID_KEYSTORE_PASSWORD:-spark12345}" \
            -Dandroid.injected.signing.key.password="${ANDROID_KEY_PASSWORD:-spark12345}" \
            -Dandroid.injected.signing.key.alias=sparkrelease \
            -Dandroid.injected.signing.key.store=spark-release-key.keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: SPARK Android v${{ github.run_number }}
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            🤖 SPARK 星火通证 Android APP (v${{ github.run_number }})
            - 钱包连接 / 链上空投 / P2P 聊天 / Web3 AI / 商城 / 行情
            - 安装：下载 APK → 允许「未知来源」→ 安装
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
